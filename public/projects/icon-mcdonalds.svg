<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68" role="img" aria-label="McDonald's">
    <!--
        An app-icon tile: the partner's ground with their real mark on it,
        filling the square so nothing floats in a plate. The mark is whichever
        of white or near-black holds better on that ground — 3.1:1 here —
        rather than a fixed colour, since brand grounds run from Uber Eats'
        light green to Expedia's blue.
    -->
