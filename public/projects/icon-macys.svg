<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68" role="img" aria-label="Macy's">
    <!--
        An app-icon tile: the partner's ground with their real mark on it,
        filling the square so nothing floats in a plate. The mark is whichever
        of white or near-black holds better on that ground — 4.8:1 here —
        rather than a fixed colour, since brand grounds run from Uber Eats'
        light green to Expedia's blue.
    -->
    <rect width="68" height="68" fill="#E21A2C"/>
    <g transform="translate(14.96 14.96) scale(1.5867)">
        <path d="M12.015.624L9.19 9.293H0l7.445 5.384-2.819 8.673L12 17.986l7.422 5.393-2.835-8.713L24 9.292h-9.162L12.015.622v.002z" fill="#FFFFFF"/>
    </g>
</svg>
