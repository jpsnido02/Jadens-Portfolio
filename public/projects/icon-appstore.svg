<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68" role="img" aria-label="App Store">
    <!--
        The App Store icon, drawn: the mark is three strokes forming an A over
        a blue field, which is simple enough to render exactly rather than
        approximate. It only ever appears at 60pt inside the phone, as the
        thing the store opens out of.
    -->
    <defs>
        <linearGradient id="as" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1FBCFD"/>
            <stop offset="1" stop-color="#0073F6"/>
        </linearGradient>
    </defs>
    <rect width="68" height="68" fill="url(#as)"/>
    <g stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" fill="none">
        <path d="M23.5 46.5 36.8 23.5"/>
        <path d="M44.5 46.5 31.2 23.5"/>
        <path d="M18 39.5h32"/>
        <path d="M19.5 46.5 17 50.8"/>
        <path d="M48.5 46.5 51 50.8"/>
    </g>
</svg>
