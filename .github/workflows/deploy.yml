name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the deploy job publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than
# cancelling a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tsc -b runs as part of build, so a type error fails the deploy.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
